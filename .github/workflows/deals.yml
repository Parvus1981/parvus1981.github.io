name: Обновление акций

on:
  schedule:
    - cron: '30 5 * * *'   # ежедневно 06:30 по Берлину
  workflow_dispatch: {}     # можно запустить вручную из вкладки Actions
  push:
    paths:
      - 'scripts/update-deals.mjs'
      - 'config/**'

permissions:
  contents: write

concurrency:
  group: deals-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Собрать свежие акции по настройки zip
        run: node scripts/update-deals.mjs

      - name: Закоммитить и запушить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          if git diff --cached --quiet; then
            echo "Акции не изменились — пушить нечего"
          else
            git commit -m "Акции обновлены $(date -u +'%d.%m.%Y %H:%M UTC')"
            git push
          fi
